name: Build/Verify/Publish MR/Release

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: '0'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run detekt
        run: |
          cd Kuroba
          chmod +x ./gradlew
          ./gradlew detekt

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: '0'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit-tests
        run: |
          cd Kuroba
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m"

  publish-beta:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, '[beta]')
    needs: [precheck, unit-test]
    uses: ./.github/workflows/build-setup.yml
    with:
      publish-type: beta
    secrets: inherit

  publish-stable:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, '[stable]')
    needs: [precheck, unit-test]
    uses: ./.github/workflows/build-setup.yml
    with:
      publish-type: stable
    secrets: inherit
