name: Build and Sign Android APK

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: '0'
        
    - name: Set up JDK 21
      uses: actions/setup-java@v2
      with:
        java-version: '21'
        distribution: 'adopt'
        
    - name: Build and run tests
      run: |
        cd Kuroba
        chmod +x ./gradlew
        ./gradlew testDevDebugUnitTest --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m"

    - name: Check user permission
      id: check
      if: |
        github.event_name == 'push' &&
        (startsWith(github.event.head_commit.message, '[beta]') || startsWith(github.event.head_commit.message, '[stable]'))
      uses: scherermichael-oss/action-has-permission@master
      with:
        required-permission: write
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      if: steps.check.outputs.has-permission
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install/Upgrade pip and requests
      if: steps.check.outputs.has-permission
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Decode Keystore File
      if: steps.check.outputs.has-permission
      run: |
        echo ${{ secrets.KEYSTORE }} | base64 -d > ${{ github.workspace }}/kurobaex.jks

    - name: Build and sign APK
      if: steps.check.outputs.has-permission
      run: |
        cd Kuroba
        chmod +x ./gradlew
        
        if [[ "${{ github.event.head_commit.message }}" == "[beta]"* ]]; then
          echo "Building beta release"
          ./gradlew assembleBetaRelease -Pandroid.injected.signing.store.file=${{ github.workspace }}/kurobaex.jks -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
          python ${{ github.workspace }}/.github/workflows/create_release.py beta
        elif [[ "${{ github.event.head_commit.message }}" == "[stable]"* ]]; then
          echo "Building stable release"
          ./gradlew assembleStableRelease -Pandroid.injected.signing.store.file=${{ github.workspace }}/kurobaex.jks -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
          python ${{ github.workspace }}/.github/workflows/create_release.py stable
        fi
      env:
        PAT: ${{ secrets.PAT }}
